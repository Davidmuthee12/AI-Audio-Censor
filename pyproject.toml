[project]
name = "censur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "better-profanity>=0.7.0",
    "fastapi[all]>=0.135.3",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.6.1",
    "pydub>=0.25.1",
    "scalar-fastapi>=1.8.1",
    "sqlmodel>=0.0.38",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "psycopg2>=2.9.12",
    "boto3>=1.43.6",
    "replicate>=1.0.7",
    "polar-sdk>=0.31.4",
    "propelauth-fastapi>=4.4.0",
    "svix>=1.93.0",
    "logtail-python>=0.3.4",
    "flower>=2.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = ["poethepoet>=0.45.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.poe.tasks]
worker = "celery -A app.worker.tasks worker --loglevel=info --pool=solo -E"